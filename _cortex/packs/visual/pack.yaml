id: visual
nome: "Visual — referências, acervo, design system e direção"
versao: "1.0"
descricao: "Busca referências do nicho nas fontes certas, destila num sistema visual próprio (DNA, estilos, design system, direção de foto, vídeo e imagem IA), organiza o acervo e liga cada formato de conteúdo ao seu estilo. Inspira sem copiar; a marca vence."
requer_config: [marcas]
sugerir_se: "canal:instagram or canal:youtube or canal:tiktok or canal:linkedin or canal:landing-page or time:design or tem:visual"
time_padrao: marca

# Scripts (stdlib) ficam no kernel e não são instanciados: `_cortex/packs/visual/scripts/`.
# radar.py (plano e triagem) · acervo.py (manifesto e galeria) · tokens.py (DTCG, contraste, CSS, amostra)
# · consistencia.py (peça × tokens). O check 15 do doctor os usa quando o pack está instalado.

arquivos_base:
  - agents/curador-visual.agent.md.tpl
  - agents/diretor-de-arte.agent.md.tpl
  - agents/arquiteto-de-conteudo.agent.md.tpl
  - docs/fontes-de-referencia.md.tpl
  - docs/design-system.md.tpl
  - docs/tokens.json.tpl
  - docs/acervo.json.tpl
  - docs/estilos-visuais.md.tpl
  - docs/direcao-fotografica.md.tpl
  - docs/direcao-imagem-ia.md.tpl
  - docs/mapa-de-conteudo.md.tpl
  - skills/kit-visual.md.tpl

subfamilias:
  - id: PLANEJAR.kit-visual
    nome: "Kit visual completo"
    condicao: "sempre"
    sinais: ["kit visual", "criar a identidade visual do zero", "montar o sistema visual da marca", "recriar a estética da marca", "do nicho ao design system", "onboarding visual"]
    obrigatorio: [diretor-de-arte, kit-visual]
    condicional:
      - {se: "falta o bloco visual no config", abrir: "§B11 de questionario.md (onboarding visual)"}
    complementar: [fontes-de-referencia, design-system]
    orcamento: 6
    arquivos:
      - skills/kit-visual.md.tpl

  - id: ANALISAR.referencias-visuais
    nome: "Radar de referências"
    condicao: "sempre"
    sinais: ["buscar referências", "referências do nicho", "moodboard", "o que os melhores do nicho fazem", "inspiração visual para", "pesquisar estética"]
    obrigatorio: [curador-visual, radar-de-referencias, fontes-de-referencia]
    condicional:
      - {se: "a fonte exige login ou API", abrir: "§3 de governanca.md (dados proibidos em prompt) e o cofre do projeto"}
    complementar: [estilos-visuais]
    orcamento: 5
    arquivos:
      - skills/radar-de-referencias.md.tpl

  - id: ANALISAR.dna-visual
    nome: "DNA visual de referências"
    condicao: "sempre"
    sinais: ["extrair o estilo dessa referência", "o que faz essa peça funcionar", "DNA visual", "engenharia reversa do visual", "analisa essa imagem de referência", "tokens dessa referência"]
    obrigatorio: [diretor-de-arte, dna-visual]
    condicional:
      - {se: "referência de terceiros", abrir: "fontes-de-referencia"}
    complementar: [estilos-visuais, design-system]
    orcamento: 4
    arquivos:
      - skills/dna-visual.md.tpl

  - id: OPERAR.acervo-visual
    nome: "Acervo visual"
    condicao: "sempre"
    sinais: ["organizar o acervo", "galeria de referências", "catálogo de imagens", "acervo visual", "registrar licença da imagem", "onde estão as referências aprovadas"]
    obrigatorio: [curador-visual, acervo-visual]
    complementar: [fontes-de-referencia]
    orcamento: 4
    arquivos:
