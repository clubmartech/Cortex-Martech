# Cenário A — SaaS B2B para a indústria da construção
# Cenário fictício de um ecossistema SaaS de construção (marcas, produtos, canais e times),
# sem dados sensíveis (preços, métricas, pessoas, ids de sistemas).
# Uso: python3 _cortex/cli/cortex.py init --answers _cortex/onboarding/exemplos/saas-b2b-construcao.yaml

meta:
  schema_version: 1
  cortex_version: "0.1.0"
  criado_em: "2026-10-03"
  onboarding:
    status: complete
    blocos_concluidos: [B0, B1, B2, B3, B4, B5, B6, B7, B8, B9, B10]
    assumidos: []

sessao:
  idioma: pt-BR
  ambiente: [claude-code, cowork]
  gate: declarativo+hook
  papel_configurador: mkt-ops

organizacao:
  nome: Ecossistema Construtech
  slug: construtech
  segmento: saas-b2b-construcao
  modelo_comercial: B2B
  porte: grande
  descricao: "Plataforma de gestão para construtoras e incorporadoras: ERP, planejamento de obra, compras e crédito."

marcas:
  - slug: construtech
    nome: Construtech
    genero: m
    mae: true
    tom: [tecnico, direto, proximo-do-canteiro]
    termos_proibidos: [solução completa, revolucionário, o melhor do mercado]
    termos_preferidos: {software: plataforma, cliente: construtora}
    site: "https://exemplo.com.br"
  - slug: holding
    nome: Holding
    genero: f
    mae: false
    tom: [institucional, confiante, sobria]
    termos_proibidos: []
    termos_preferidos: {}

produtos:
  - slug: erp-obras
    nome: ERP Obras
    tipo: produto
    marca: construtech
    publicos: [diretor-financeiro, gestor-obras]
    dor_principal: Custo da obra estoura sem que ninguém veja a tempo.
    promessa: "Visibilidade de custo e caixa por obra, em tempo real."
    modulos: [orcamento, suprimentos, financeiro, fiscal]
  - slug: planejamento-obra
    nome: Planejamento de Obra
    tipo: produto
    marca: construtech
    publicos: [gestor-obras, engenheiro-planejamento]
    dor_principal: Cronograma vira ficção depois da segunda semana.
    promessa: Planejamento que o canteiro consegue seguir.
    modulos: [cronograma, gantt, curva-s]
  - slug: credito-construcao
    nome: Crédito Construção
    tipo: servico
    marca: construtech
    publicos: [diretor-financeiro]
    dor_principal: Capital de giro travado entre a medição e o recebimento.
    promessa: Antecipação de recebíveis integrada ao ERP.
    modulos: []
  - slug: summit-construcao
    nome: Summit da Construção
    tipo: evento
    marca: construtech
    publicos: [diretor-financeiro, gestor-obras]
    dor_principal: ""
    promessa: Dois dias com quem decide a obra no Brasil.
    modulos: []

publicos:
  - {slug: diretor-financeiro, nome: Diretor financeiro de construtora, tipo: comprador, dor: Não enxerga margem por obra até fechar o mês., objecao: "Já tenho planilha e ERP genérico; trocar é caro.", territorio: construtora}
  - {slug: gestor-obras, nome: Gestor de obras, tipo: usuario, dor: Passa o dia apagando incêndio e preenchendo relatório., objecao: Sistema bonito que ninguém no canteiro usa., territorio: construtora}
  - {slug: engenheiro-planejamento, nome: Engenheiro de planejamento, tipo: influenciador, dor: Replaneja toda semana porque o dado chega atrasado., objecao: "Ferramenta nova = mais um lugar para digitar.", territorio: construtora}
  - {slug: fornecedor-construcao, nome: Fornecedor de material e serviço, tipo: parceiro, dor: Vende para a obra sem saber quando vai receber., objecao: Marketplace cobra comissão e não traz volume., territorio: fornecedor}

