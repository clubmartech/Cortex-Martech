  ratificador: comite-ia
  auditoria: {periodicidade: semanal, quando: "segunda 08:15"}
  git: true
  telemetria: {ativa: true, destino_env: CORTEX_TELEMETRY_URL}
  dados_proibidos_em_prompt: [preco-de-produto, dados-de-cliente, metricas-internas, financeiro-da-empresa, credenciais]
  limites: {aviso_kb: 35, erro_kb: 60, binario_mb: 2}

